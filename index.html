<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ruta de Campo - Raptor S.A.S.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .card h3 { margin-top: 0; color: #2c3e50; font-size: 16px; }
        
        textarea { width: 100%; height: 120px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        
        .btn { background-color: #ff9800; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .btn-maps { background-color: #2196F3; color: white; text-decoration: none; padding: 8px 12px; display: block; text-align: center; border-radius: 4px; font-weight: bold; margin-top: 8px; }
        .btn-visit { background-color: #4CAF50; color: white; border: none; padding: 8px 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-del { background-color: #f44336; color: white; border: none; padding: 6px 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 11px; }

        .badge-pico { background: #8B0000; color: white; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-habil { background: #2e7d32; color: white; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        
        .counter { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

    <header>📍 Ruta de Campo - Raptor S.A.S. (Alta Precisión)</header>

    <div class="container">
        <!-- Panel de Ingreso -->
        <div class="card">
            <h3>📱 Pegar Lote Masivo de WhatsApp</h3>
            <textarea id="txtWhatsapp" placeholder="Pega aquí todos los reportes juntos..."></textarea>
            <button class="btn" onclick="procesarLote()">Analizar y Generar Rutas Exactas</button>
        </div>

        <!-- Listado de Vehículos y Rutas -->
        <div id="listaRutas">
            <p style="text-align: center; color: #777;">No hay rutas cargadas. Pega tu reporte arriba para comenzar.</p>
        </div>
    </div>

    <script>
        var registrosLote = [];

        function esNomenclaturaValida(dir) {
            var match = dir.match(/#\s*([0-9]+)/);
            if (match) {
                var numeroPlaca = parseInt(match[1], 10);
                if (numeroPlaca > 250) return false;
            }
            return true;
        }

        var diaSemana = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
        var reglasPico = {
            0: ['0', '2'],
            1: ['1', '4'],
            2: ['8', '9'],
            3: ['3', '6'],
            4: ['5', '7']
        };

        function tienePicoYPlaca(placa) {
            if (reglasPico[diaSemana]) {
                var ultimo = placa.trim().slice(-1);
                return reglasPico[diaSemana].includes(ultimo);
            }
            return false;
        }

        function procesarLote() {
            var texto = document.getElementById('txtWhatsapp').value;
            if(!texto) { alert("Por favor pega el texto del reporte."); return; }

            var bloques = texto.split(/UBICAR|\[\d+\/\d+.*Principal:/gi);
            var agregados = 0;

            bloques.forEach(function(bloque) {
                if (bloque.trim().length < 5) return;

                var matches = bloque.match(/[A-Z]{3}[0-9A-Z]{3}/gi);
                if (!matches) return;

                var placa = "";
                var ignorar = ["UBICAR", "PRINC", "PARTES", "DETAL", "CELUL", "SOATX"];
                for (var i = 0; i < matches.length; i++) {
                    var cand = matches[i].toUpperCase();
                    var bad = false;
                    for (var j = 0; j < ignorar.length; j++) {
                        if (cand.includes(ignorar[j])) { bad = true; break; }
                    }
                    if (!bad) { placa = cand; break; }
                }

                if (!placa) return;

                var marca = "VEHÍCULO";
                var linea = "GENERAL";
                var modelo = "2026";
                var color = "N/A";

                var lineas = bloque.split('\n');
                lineas.forEach(function(l) {
                    var up = l.toUpperCase();
                    if (up.includes("MARCA:")) marca = l.replace(/Marca:/i, '').trim();
                    if (up.includes("LÍNEA:") || up.includes("LINEA:")) linea = l.replace(/Línea:|Linea:/i, '').trim();
                    if (up.includes("MODELO:")) modelo = l.replace(/Modelo:/i, '').trim();
                    if (up.includes("COLOR:")) color = l.replace(/Color:/i, '').trim();
                });

                var telsMatch = bloque.match(/3[0-9]{9}/g);
                var telefonos = telsMatch ? telsMatch.slice(0, 2).join(', ') : "N/A";

                var direcciones = [];
                lineas.forEach(function(l) {
                    var dirLimpia = l.trim();
                    var up = dirLimpia.toUpperCase();
                    if ((up.includes("#") || up.includes("CL ") || up.includes("KR ") || up.includes("CR ") || up.includes("TV ") || up.includes("AV ")) && up.length > 5) {
                        if (!up.includes("PARTES") && !up.includes("DETALLE") && !up.includes("SOAT") && !up.includes("CEL")) {
                            if (esNomenclaturaValida(dirLimpia)) {
                                direcciones.push(dirLimpia);
                            }
                        }
                    }
                });

                var ubicacionesFinales = direcciones.slice(0, 3);
                if (ubicacionesFinales.length === 0) {
                    ubicacionesFinales = ["Antioquia, Colombia"];
                }

                ubicacionesFinales.forEach(function(dir) {
                    registrosLote.push({
                        id: Math.random().toString(36).substr(2, 5),
                        placa: placa,
                        marca: marca,
                        linea: linea,
                        modelo: modelo,
                        color: color,
                        telefonos: telefonos,
                        dir: dir
                    });
                });

                agregados++;
            });

            if (agregados > 0) {
                renderizarLista();
                alert("🚀 ¡Lote analizado con éxito! Se cargaron los vehículos.");
                document.getElementById('txtWhatsapp').value = '';
            } else {
                alert("⚠️ No se pudieron extraer placas válidas. Revisa el texto.");
            }
        }

        function marcarVisitada(id) {
            var key = 'visitas_' + id;
            var actual = parseInt(localStorage.getItem(key) || 0) + 1;
            localStorage.setItem(key, actual);
            document.getElementById('visitas-' + id).innerText = actual;
        }

        function eliminarItem(id) {
            registrosLote = registrosLote.filter(function(item) { return item.id !== id; });
            renderizarLista();
        }

        function renderizarLista() {
            var contenedor = document.getElementById('listaRutas');
            if (registrosLote.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; color: #777;">No hay rutas cargadas.</p>';
                return;
            }

            var html = '';
            registrosLote.forEach(function(item, idx) {
                var pico = tienePicoYPlaca(item.placa);
                var estadoBadge = pico ? '<span class="badge-pico">⚠️ PICO Y PLACA</span>' : '<span class="badge-habil">✅ HÁBIL</span>';
                var visitas = localStorage.getItem('visitas_' + item.id) || 0;
                var mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.dir);

                html += `
                    <div class="card">
                        <h3>#${idx + 1} - Placa: ${item.placa} ${estadoBadge}</h3>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Vehículo:</b> ${item.marca} ${item.linea} (${item.modelo} - ${item.color})</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Teléfonos:</b> ${item.telefonos}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Dirección:</b> ${item.dir}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Visitas:</b> <span class="counter" id="visitas-${item.id}">${visitas}</span></p>
                        
                        <a href="${mapsUrl}" target="_blank" class="btn-maps">🧭 Abrir ruta exacta en Google Maps</a>
                        <button class="btn-visit" onclick="marcarVisitada('${item.id}')">✅ Marcar Visitada</button>
                        <button class="btn-del" onclick="eliminarItem('${item.id}')">🗑️ Eliminar este punto</button>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
